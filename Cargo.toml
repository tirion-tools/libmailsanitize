[package]
name = "mailsanitize"
description = "HTML sanitizer: ammonia + lightningcss reconstruction, dark policy v1, text fallback (static musl)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
proto.workspace = true
prost.workspace = true
libc.workspace = true
ammonia = "=4.2.5"
html5ever = "=0.40.1"
lol_html = "2"
lightningcss = { version = "1.0.0-alpha.68", default-features = false, features = ["visitor"] }
palette = { version = "0.7", default-features = false, features = ["std"] }
png = "0.17"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
confine.workspace = true

[lints]
workspace = true
