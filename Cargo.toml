[package]
name = "mailsanitize"
description = "HTML email sanitizer: allowlist sanitizing, CSS reprint, dark-mode transform and an isolated text fallback"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[dependencies]
ammonia = "=4.2.5"
html5ever = "=0.40.1"
lol_html = "2"
lightningcss = { version = "1.0.0-alpha.68", default-features = false, features = ["visitor"] }
palette = { version = "0.7", default-features = false, features = ["std"] }
png = "0.17"
base64 = "0.22"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "abort"
codegen-units = 1
