<title>Weekend forecast</title>
<style>

<body style="margin:0;">
<table class="wrap" width="100%" cellpadding="0" cellspacing="0" style="font-family:Roboto,Arial,sans-serif;"><tr><td align="center" style="padding:20px;">
  <table width="560" cellpadding="0" cellspacing="0">
    <tr><td class="title" style="font-size:24px;font-weight:bold;padding-bottom:8px;">Your weekend forecast for Riverton</td></tr>
    <tr><td class="body-text" style="font-size:15px;line-height:22px;padding-bottom:16px;">A dry Saturday with morning fog, then showers from Sunday lunchtime. Winds ease by evening.</td></tr>

      <table width="100%" cellpadding="12" cellspacing="6"><tr>

        <td class="tile" width="33%" style="border-radius:8px;font-size:14px;"><b>Sun</b><br>12&deg; / 8&deg;<br>Showers</td>
      </tr></table>
    </td></tr>
    <tr><td class="note" style="font-size:12px;padding-top:12px;">Forecast issued 06:00 local time. Data &copy; Example Met Service.</td></tr>
  </table>
</td></tr></table>
