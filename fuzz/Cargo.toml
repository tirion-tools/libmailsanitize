[package]
name = "mailsanitize-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
html5ever = "=0.40.1"
libfuzzer-sys = "0.4"
mailsanitize = { path = ".." }
markup5ever_rcdom = "=0.40.1"

[[bin]]
name = "sanitize"
path = "fuzz_targets/sanitize.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
